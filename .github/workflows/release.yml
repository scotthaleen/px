name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Require master
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/master

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1
      - name: Allocate CalVer
        id: metadata
        shell: bash
        run: |
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          day=$(date -u -d "$built" +%Y.%m.%d)
          version=$day
          suffix=0
          while git show-ref --verify --quiet "refs/tags/$version"; do
            suffix=$((suffix + 1))
            version="$day.$suffix"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$built" >> "$GITHUB_ENV"
      - name: Build archives
        run: task package VERSION="$VERSION" COMMIT="$GITHUB_SHA" BUILD_DATE="$BUILD_DATE"
      - name: Include public installers
        run: |
          cp install.sh install.ps1 "dist/release/$VERSION/"
          cd "dist/release/$VERSION"
          sha256sum install.sh install.ps1 >> SHA256SUMS
      - name: Verify checksums and Linux executables
        shell: bash
        run: |
          cd "dist/release/$VERSION"
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8
          mkdir verify
          tar -xzf "px-$VERSION-linux-amd64.tar.gz" -C verify
          ./verify/px version
          ./verify/px-server version
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit' verify/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/release/${{ steps.metadata.outputs.version }}/*.tar.gz
            dist/release/${{ steps.metadata.outputs.version }}/*.zip
            dist/release/${{ steps.metadata.outputs.version }}/install.sh
            dist/release/${{ steps.metadata.outputs.version }}/install.ps1
            dist/release/${{ steps.metadata.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/release
      - name: Verify downloaded assets
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - name: Create immutable tag and draft release
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
          gh release create "$VERSION" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "PX $VERSION" --generate-notes
      - name: Publish release
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
